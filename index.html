<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<title>盧 暁南 / 卢晓南 / Xiao-Nan Lu</title>
		<link rel="stylesheet" href="indxpage.css">
		<script type="text/javascript">
			function load_an_html(fname) {
			document.getElementById("content").innerHTML='<object type="text/html" data="'+fname+'" width="100%" height="100%"></object>';
				trackGoatCounterPage(fname);
			}

			function trackGoatCounterPage(fname) {
				if (!window.goatcounter || typeof window.goatcounter.count !== "function") {
					return;
				}

				window.goatcounter.count({
					path: "/" + fname,
					title: fname
				});
			}

			function toggleMenu() {
				var nav = document.getElementById('nav');
				if (nav.style.left === "-230px") {
					nav.style.left = "0";
				} else {
					nav.style.left = "-230px";
				}
			}
		</script>
	</head>

	<body>
		<header id="header">
			<div id="logo">
				<h1>盧 暁南 / 卢晓南 / Xiao-Nan Lu</h1>
			</div>
			<span id="menu-toggle" onclick="toggleMenu()">☰</span>
		</header>

		<main>
			<div class="innertube" id="content">
				<object type="text/html" data="aboutme.html" width="100%" height="100%"></object>
			</div>
		</main>

		<nav id="nav">
			<div class="innertube">
				<h1> </h1>
				<ul>
					<li><a id="aboutme" href="#" onclick="load_an_html('aboutme.html')"> About me </a></li>
					<li><a id="cv-en" href="#" onclick="load_an_html('cv.html')">Profile</a></li>
					<li><a id="cv-ja" href="#" onclick="load_an_html('cv_j.html')">略歴</a></li>
					<li><a id="research" href="#" onclick="load_an_html('research.html')">Research Interests</a></li>
					<li><a id="publication" href="#" onclick="load_an_html('publication.html')">Publications</a></li>
					<li><a id="organize" href="#" onclick="load_an_html('organize.html')">Organized Events</a></li>
					<li><a id="conference" href="#" onclick="load_an_html('confs.html')">Attended Events</a>
						<ul>
					<li><small><a href="#" onclick="load_an_html('conf_past.html')">Before April 2020</a></small></li>
					</ul>
					</li>
					<li><a id="grants" href="#" onclick="load_an_html('grants.html')">研究助成金</a></li>
					<li><a id="teaching" href="#" onclick="load_an_html('teaching.html')">担当授業</a></li>
					<li><a id="clinks" href="#" onclick="load_an_html('links_c.html')">日中翻訳書籍</a></li>
					<li><a id="jlinks" href="#" onclick="load_an_html('links_j.html')">Links</a></li>
				</ul>
		</div>
	</nav>
	<script data-goatcounter="https://xnlu.goatcounter.com/count"
		async src="//gc.zgo.at/count.js"></script>
	</body>
</html>
